name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run CV parser and app unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Generate CI release keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/arama-release.jks" \
            -storetype JKS \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AI Kariyer Yolculugu, OU=CI, O=AI Kariyer Yolculugu, L=Istanbul, ST=Istanbul, C=TR"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/arama-release.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk > /dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk > apk-sha256.txt
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload app-release.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
  
      - name: Publish verified release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-build.${{ github.run_number }}
          name: A-Kariyer Yolculuğu 1.3.0 (Build ${{ github.run_number }})
          body: |
            CV kaynak doğruluğu: uydurma şirket/deneyim kaldırıldı.
            Otomatik CV ayrıştırma testleri ve Android Release APK doğrulandı.
            Not: CI geçici imzalama anahtarı kullanır; önceki APK'nın üzerine yüklemede imza uyuşmazlığı yaşanabilir.
          files: |
            app/build/outputs/apk/release/app-release.apk
            apk-sha256.txt
          fail_on_unmatched_files: true
